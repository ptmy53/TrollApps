name: macOS runner otomatik yeniden deneme

# GitHub'ın macOS runner havuzunda kapasite sıkışıklığı olduğunda iş
# "The job was not acquired by Runner of type hosted even after multiple attempts"
# hatasıyla, hiçbir adım çalışmadan iptal edilir (15 dakika sonra).
# Bu workflow YALNIZCA bu durumu yakalar (runner atanmamış + 0 adım çalışmış)
# ve işi otomatik olarak yeniden kuyruğa atar. Gerçek derleme hatalarında,
# elle iptal edilen işlerde devreye girmez. En fazla 6 deneme yapılır.

on:
  workflow_run:
    workflows: ["Build TrollApps IPA (Updates section)"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-macos-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Runner alınamadıysa yeniden dene
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          ATTEMPT=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_attempt)
          if [ "$ATTEMPT" -ge 6 ]; then
            echo "Deneme sınırına ulaşıldı ($ATTEMPT/6). GitHub kapasitesi düzelince elle yeniden denemek gerekiyor."
            exit 0
          fi

          JOBS=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs")
          TOTAL=$(echo "$JOBS" | jq '.jobs | length')
          STUCK=$(echo "$JOBS" | jq '[.jobs[] | select((.runner_name // "") == "" and ((.steps // []) | length) == 0)] | length')

          echo "İş sayısı: $TOTAL, runner alamayan: $STUCK, deneme: $ATTEMPT/6"

          if [ "$TOTAL" -eq 0 ] || [ "$STUCK" -ne "$TOTAL" ]; then
            echo "Gerçek hata (runner atanmış veya adımlar çalışmış). Otomatik yeniden deneme yok."
            exit 0
          fi

          echo "Tüm işler runner alamadan sonlandı. Yeniden kuyruğa alınıyor (deneme $ATTEMPT/6)."
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" \
            || gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun"
