name: Build TrollApps IPA (Updates section)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            newest="$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)"
            if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          fi
          xcodebuild -version

      - name: Clone upstream
        run: git clone --depth 1 https://github.com/TheResonanceTeam/TrollApps.git src

      - name: Apply UI patch
        run: |
          cd src
          git apply --verbose "$GITHUB_WORKSPACE/updates-section.patch"

      - name: Add shared scheme
        run: |
          mkdir -p src/TrollApps/TrollApps.xcodeproj/xcshareddata/xcschemes
          cat > src/TrollApps/TrollApps.xcodeproj/xcshareddata/xcschemes/TrollApps.xcscheme <<'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1540" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="6D8817C1291ECB97007139C6" BuildableName="TrollApps.app" BlueprintName="TrollApps" ReferencedContainer="container:TrollApps.xcodeproj"/>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
              <BuildableProductRunnable runnableDebuggingMode="0">
                <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="6D8817C1291ECB97007139C6" BuildableName="TrollApps.app" BlueprintName="TrollApps" ReferencedContainer="container:TrollApps.xcodeproj"/>
              </BuildableProductRunnable>
            </LaunchAction>
            <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES"/>
            <AnalyzeAction buildConfiguration="Debug"/>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
          </Scheme>
          SCHEME

      - name: Build (unsigned)
        run: |
          cd src
          xcodebuild \
            -project TrollApps/TrollApps.xcodeproj \
            -scheme TrollApps \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_VERSION=5.0 \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Write entitlements
        run: |
          cat > "$RUNNER_TEMP/ent.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>org.resonance.store</string>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.security.container-manager</key>
            <true/>
            <key>com.apple.private.security.storage.AppBundles</key>
            <true/>
            <key>com.apple.private.security.storage.AppDataContainers</key>
            <true/>
            <key>com.apple.private.MobileContainerManager.allowed</key>
            <true/>
            <key>com.apple.private.persona-mgmt</key>
            <true/>
            <key>com.apple.security.exception.files.absolute-path.read-write</key>
            <array>
              <string>/</string>
            </array>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ent.plist"

      - name: Sign app (ldid)
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/TrollApps.app"
          brew install ldid >/dev/null 2>&1 || true
          if ! command -v ldid >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/ldid" https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64 || true
            chmod +x "$RUNNER_TEMP/ldid" 2>/dev/null || true
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          if command -v ldid >/dev/null 2>&1; then
            ldid -S"$RUNNER_TEMP/ent.plist" "$APP/TrollApps"
            echo "signed with ldid"
          else
            codesign --force --sign - --entitlements "$RUNNER_TEMP/ent.plist" "$APP/TrollApps"
            echo "signed with codesign (ad-hoc)"
          fi

      - name: Verify patch is in the build
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/TrollApps.app"
          echo "--- localization keys in built app ---"
          plutil -p "$APP/en.lproj/Localizable.strings" | grep -E 'UPDATES|ALL_APPS' || echo "KEYS NOT FOUND"
          echo "--- UI strings inside binary ---"
          (strings -a "$APP/TrollApps" | grep -x -E 'UPDATES|ALL_APPS|NO_UPDATES' | sort -u) || echo "STRINGS NOT FOUND"

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/TrollApps.app"
          rm -rf "$RUNNER_TEMP/pkg"
          mkdir -p "$RUNNER_TEMP/pkg/Payload"
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/TrollApps.app"
          cd "$RUNNER_TEMP/pkg"
          zip -qry "$RUNNER_TEMP/TrollApps-updates.ipa" Payload
          echo "--- ipa ---"
          ls -la "$RUNNER_TEMP/TrollApps-updates.ipa"
          shasum -a 256 "$RUNNER_TEMP/TrollApps-updates.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: TrollApps-updates-ipa
          path: ${{ runner.temp }}/TrollApps-updates.ipa
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="updates-build-${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/TrollApps-updates.ipa" \
            --repo "${{ github.repository }}" \
            --title "TrollApps 2.3 with Updates section (build ${{ github.run_number }})" \
            --notes "TrollApps built from upstream source with an Updates section at the top of the Browse list. Install with TrollStore." \
            || gh release upload "$TAG" "$RUNNER_TEMP/TrollApps-updates.ipa" --repo "${{ github.repository }}" --clobber
          gh release view "$TAG" --repo "${{ github.repository }}" --json url -q .url
